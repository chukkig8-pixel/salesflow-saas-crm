version: '3.8'

services:
  salesflow-app:
    build: .
    container_name: salesflow_crm_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=salesflow-db
      - DB_NAME=salesflow_crm
      - DB_USER=salesflow_user
      - DB_PASSWORD=secure_crm_pass
    depends_on:
      - salesflow-db
    networks:
      - crm-network

  salesflow-db:
    image: mysql:8.0
    container_name: salesflow_crm_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_master_pass
      MYSQL_DATABASE: salesflow_crm
      MYSQL_USER: salesflow_user
      MYSQL_PASSWORD: secure_crm_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./salesflow_crm_database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - crm-network

volumes:
  mysql_data:

networks:
  crm-network:
    driver: bridge

